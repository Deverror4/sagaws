; --- ROUTE: PLAY OR STOP THE RECORDED ROUTE [F11] ---
; Walks route_active.ini on a loop from its closest point. Press again to stop. Separate from Pet Farm.
; Every wait here has a limit. F9 (config line 24) is the emergency movement pause.
[122]
keys=esp % delete,37,1|wmark?|cmp(VAR % WMS),1.0|gt6
keys2=wmark|store % route_wait,0|esp % add,37,1,ROUTE: STOPPING,900,750,(VAR % ESP_FontSize),65280
keys3=s500|wmark?|eq % WMS,0|esp % edit,37,1,ROUTE: STOPPED|s2000|esp % delete,37,1|gt*
keys4=add % route_wait,1|cmp(VAR % route_wait),8.0|gt3
keys5=esp % edit,37,1,ROUTE: STILL MOVING - PRESS F9|s4000|esp % delete,37,1|gt*
keys6=wmark?|!eq % WMS,0|esp % add,37,1,ROUTE: STILL STOPPING - TRY AGAIN,900,750,(VAR % ESP_FontSize),65280|s3000|esp % delete,37,1|gt*
keys7=esp % add,37,1,ROUTE: STARTING,900,750,(VAR % ESP_FontSize),65280|cc % -twrepeat* route_active.ini,?
keys8=s2500|wmark?|cmp(VAR % WMS),1.0|esp % edit,37,1,ROUTE: DID NOT START|s4000|esp % delete,37,1|gt*
keys9=esp % edit,37,1,ROUTE: RUNNING - F11 TO STOP|s3000|esp % delete,37,1
repeat=0
interrupt=0
pass=0
endkeys=122u

