; ====================================================================================
; --- GUIDE & TUTORIAL (AION 2 CHANTER - SPEEDER V138 COMPLIANT ) ---
; ====================================================================================
; Before we start make sure to enable "Pursue Targets with Skill activation and autotarget Upon skill use" from game options.
;
; 1. IN-GAME MACRO SETUP & SECONDARY BINDS:
;      - Enable "Skill Queue" in the game settings.
;      - GO TO KEYBINDS: Set "R" as the secondary key for Left Click.
;      - GO TO KEYBINDS: Set "Numpad -" as the secondary key for ingame macro (Right Click).
;
; 2. VIRTUAL LEASH (ANCHOR SYSTEM) [NUM 8]:
;      - Mode 9 acts exactly like Full Auto (NUM 2), but restricts the bot to the exact spot where you activated it.
;      - Perfect for AFK farming small areas without wandering off.
;
; 3. AUTO-AFK MANAGER [NUM 9] (NEW):
;      - A standalone background manager that safely cycles 20-25 mins of farming and 5-7 mins of sleeping.
;      - When activated, it waits for the current target to die before gracefully pausing the active mode (Free Roam or Leash).
;      - It resumes the previous mode automatically after the break is over. 
;      - Toggle it off anytime to instantly interrupt the break and regain manual control without locking Speeder.
;
; 4. UNDERSTANDING THE ACTIVATION MODES (TOGGLES):
;      - Mode 1 | Full Auto (PvE Free Roam) [NUM 2]: Automated targeting, mobility, combos, and looting anywhere.
;      - Mode 2 | Full Auto PVP ONLY [NUM 4]: Targets ONLY players up to 40m using the new "tpp" priority system.
;      - Mode 3 | PvP Auto-Dodge Radar [NUM 3]: Scans enemy casts aimed directly at you and dodges them.
;      - Mode 4 | Semi-Auto DPS [Left Click / KEY 1]: Attacks your manually selected target. (Use NUM 1 to toggle TP/Dash).
;      - Mode 5 | PvE TP / Dash Toggle [NUM 1]: Turns Gap Closers ON or OFF dynamically (ON by default).
;      - Mode 6 | PvE Auto-Dodge Radar [NUM 6]: Universal boss/mob red telegraph scan.
;      - Mode 7 | Auto-Loot Toggle [NUM 5]: Turns automatic looting ON or OFF dynamically (ON by default).
;      - Mode 8 | Buffs Toggle [NUM 7]: Turns Heavy DPS/Survival Buffs ON or OFF (ON by default).
;      - Mode 9 | Virtual Leash Auto [NUM 8]: Automated farming restricted to the starting position coordinates.
;      - Mode 10| Auto-AFK Manager [NUM 9]: Cycles active farm modes with automated realistic breaks.
; ====================================================================================

[variables]
AttackSpeed=1.5
MoveSpeed_Combat=1.4
MoveSpeed_Default=1.2

; --- DEFAULT STATES (Active on Load) ---
autoloot_phase=active
buffs_phase=active
tp_phase=active

; =========================================================
; --- 1. DISPLAY, LOOT & AUTO-FARM CONFIGURATION ---
; =========================================================
ESP_FontSize=14
AutoTarget_Range=4000
AutoTarget_PvP_Range=4000
AutoTarget_Height=500
Boss_Min_HP_Threshold=3000
Target_Priority_Mobs=Giant Drana Bioweapon|Sura Magic Bioweapon|Modified Krao Guardian|Mutated Sura Bioweapon|Giant Krao Bioweapon

; =========================================================
; --- 2. SURVIVAL, POTIONS & MANA THRESHOLDS ---
; =========================================================
Potion_HP_Threshold=0.60
RecoverySpell_Threshold=0.90
HealingTouch_Threshold=0.50
GuardianBlessing_Threshold=1.00
Mana_Threshold=0.10
FocusedDefense_Frame_Pause=2000

; =========================================================
; --- 3. MOVEMENT & KEYBIND CONFIGURATION (VK & PK CODES) ---
; =========================================================
Key_RemoveCC_VK=32
Key_RemoveCC_PK=3141

Key_Dash_VK=160
Key_Dash_PK=3389
Key_StrafeRight_VK=68

Key_PotionPV_VK=112
Key_PotionPV_PK=3351
Key_Remedy_VK=113
Key_Remedy_PK=3353

Key_Loot_VK=70             ; Keybind for Looting (Default: F)
BackTP_Distance=100

; --- KOREAN MACRO SECONDARY BINDS ---
; 82 = R Key (Secondary bind for Onslaught / LMB)
Key_Onslaught_Hold_VK=82
; 109 = Numpad - (Secondary bind for Macro / RMB)
Key_Macro_Hold_VK=109

; =========================================================
; --- 4. SKILLS & STIGMA SLOTS CONFIGURATION ---
; =========================================================
Slot_Onslaught=1          ; LMB Basic Attack
Slot_IncandescentBlow=2   ; RMB Basic Attack & Chain Stage 2
Slot_RushingSmash=3
Slot_ImpactfulCrush=4
Slot_Recuperation=5
Slot_SpinningStrike=6
Slot_TremorCrush=7        ; Resonance Crush (1821)
Slot_WaveBlow=8           ; Bolt Crush / Wave Blow (1808) (PvP Stun Proc)

Slot_UndefeatedMantra=21  ; manual usage
Slot_SprintMantra=22      ; manual usage
Slot_GuardianBlessing=8  
Slot_PowerOfTheStorm=23
Slot_MarchutansWrath=24
Slot_FocusedDefense=24    ; Stigma Focused Defense (1814)
Slot_HealingTouch=24      

; =========================================================
; --- PUBLIC KEYBIND ROUTING (ISOLATED ESP DISPLAY) ---
; =========================================================

; --- TOGGLE: FULL AUTO PVE FREE ROAM [NUMPAD 2] ---
[98]
keys=!eq % phase,active|!eq % leash_phase,active|!eq % petfarm_phase,active|!eq % semiauto_phase,active|!eq % pvp_auto_phase,active|store % phase,active|as(VAR % AttackSpeed)|ms(VAR % MoveSpeed_Combat)|esp % add,1,1,FULL AUTO ON,900,630,(VAR % ESP_FontSize),120000|store % hold_state,off|dbg % [ON] Full Auto Free Roam Active
keys2=ibtP(VAR % AutoTarget_PvP_Range)|tcpeT(VAR % AutoTarget_PvP_Range)|call % fPvPRotation|dbg % [AUTO-DEFENSE] Enemy Player targeting me!
keys3=itp*|call % fPvPRotation
keys4=!itp*|call % fElitePrio|call % fRotation
endkeys=as1.0|ms(VAR % MoveSpeed_Default)|store % hold_state,off|(VAR % Key_Onslaught_Hold_VK)u|(VAR % Key_Macro_Hold_VK)u|store % phase,off|esp % delete,1,1|dbg % [OFF] Reset Normal Speeds
pass=1
repeat=2

