keys2=ibtP(VAR % AutoTarget_PvP_Range)|tcpeT(VAR % AutoTarget_PvP_Range)|call % fPvPRotation|dbg % [AUTO-DEFENSE] Enemy Player targeting me!
keys3=itp*|call % fPvPRotation
keys4=!itp*|call % fPetFarm
endkeys=as1.0|ms(VAR % MoveSpeed_Default)|store % hold_state,off|(VAR % Key_Onslaught_Hold_VK)u|(VAR % Key_Macro_Hold_VK)u|store % petfarm_phase,off|esp % delete,12,1|esp % delete,30,1|dbg % [OFF] Pet Soul Farm Stopped
