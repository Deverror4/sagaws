[123]
keys=eq % rec_on,1|store % rec_on,0|cc % -record|esp % delete,36,1|esp % add,36,1,ROUTE RECORD: SAVED,900,720,(VAR % ESP_FontSize),65280|s3000|esp % delete,36,1|gt*
keys2=store % rec_on,1|esp % delete,36,1|esp % add,36,1,ROUTE RECORD: ON - F12 TO SAVE,900,720,(VAR % ESP_FontSize),65280|cc % -record 500,30
repeat=0
interrupt=0
pass=0
endkeys=123u

